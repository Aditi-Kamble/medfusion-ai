{% extends "patient_base.html" %}
{% block content %}
<div class="card">
    <h2>{{ t.login_heading }}</h2>
    {% if error %}
    <p style="color:#c0392b; font-size:14px; margin-top:8px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/patient/login">
        <label>{{ t.patient_code_label }}</label>
        <input type="text" name="patient_code" placeholder="e.g. MF-1024" required>
        <label>{{ t.dob_label }}</label>
        <input type="date" name="date_of_birth" required>
        <button class="btn" type="submit">{{ t.login_button }}</button>
    </form>
    <p style="margin-top:14px; font-size:13px; color:#8a97a5;">
        {{ t.login_hint }}
    </p>
</div>
{% endblock %}
