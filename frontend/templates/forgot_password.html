{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Reset Your Password</h2>
    {% if error %}
    <p style="color:#c0392b; font-size:14px; margin-top:8px;">{{ error }}</p>
    {% endif %}
    {% if step == "answer" %}
    <form method="post" action="/ui/forgot-password">
        <input type="hidden" name="email" value="{{ email }}">
        <label>Security Question</label>
        <p style="font-size:14px; color:#3b4a5a; margin-bottom:10px;">{{ question }}</p>
        <label>Your Answer</label>
        <input type="text" name="security_answer" required>
        <label>New Password</label>
        <input type="password" name="new_password" required>
        <button class="btn" type="submit">Reset Password</button>
    </form>
    {% else %}
    <form method="get" action="/ui/forgot-password">
        <label>Email</label>
        <input type="email" name="email" required>
        <button class="btn" type="submit">Continue</button>
    </form>
    {% endif %}
</div>
{% endblock %}
