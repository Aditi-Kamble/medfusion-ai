{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Doctor Login</h2>
    {% if error %}
    <p style="color:#c0392b; font-size:14px; margin-top:8px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/ui/login">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">Login</button>
    </form>
    <p style="margin-top:10px; font-size:13px; text-align:center;">
        <a href="/ui/forgot-password">Forgot your password?</a>
    </p>
    <p style="margin-top:16px; font-size:13px; text-align:center;">
        New here? <a href="/ui/register">Create an account</a>
    </p>
    <p style="margin-top:10px; font-size:13px; text-align:center;">
        Are you a patient? <a href="/patient/login">View your report here</a>.
    </p>
</div>
{% endblock %}
