{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Doctor Login</h2>
        {% if error %}
    <p style="color:#c0392b; font-size:14px; margin-top:8px;">{{ error }}</p>
    {% endif %}
    <form method="post" action="/ui/login">
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">Login / Register</button>
    </form>
    <p style="margin-top:14px; font-size:13px; color:#8a97a5;">
        First time here? Just fill in your details — an account is created automatically.
    </p>
        <p style="margin-top:20px; font-size:13px; text-align:center;">
        Are you a patient? <a href="/patient/login">View your report here</a>.
    </p>
</div>
{% endblock %}
